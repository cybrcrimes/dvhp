            listEl.innerHTML = `<div class="muted" style="padding:8px;text-align:center;">${si ? "ගැළපෙන ද්‍රව්‍ය නොමැත" : "No matching materials"}</div>`;
            return;
          }
          listEl.innerHTML = items.map((it, i) => `
            <button type="button" class="catalog-item-btn" data-cidx="${i}">
              <span style="min-width:0;flex:1;">
                <strong style="display:block;font-size:0.83rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(si ? it.labelSi : it.labelEn)}</strong>
                <span class="muted" style="font-size:0.75rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(si ? it.labelEn : it.labelSi)}</span>
              </span>
              <span class="pill pill-bill">${escapeHtml(it.unit)}</span>
            </button>
          `).join("");
          listEl.querySelectorAll("[data-cidx]").forEach(btn => {
            btn.onclick = () => applyPreset(items[parseInt(btn.dataset.cidx, 10)]);
          });
        };

        const renderLiveSuggest = (q) => {
          const trimmed = q.trim();
          if (trimmed.length < 2) { liveSug.classList.add("hidden"); return; }
          const hits = searchSlCatalog(trimmed, "ALL", 6);
          if (!hits.length) { liveSug.classList.add("hidden"); return; }
          liveSug.classList.remove("hidden");
          liveSug.innerHTML = `<div style="font-size:0.73rem;font-weight:700;color:var(--md-primary);padding:0 4px;">${si ? "ගැළපෙන ද්‍රව්‍ය යෝජනා (තෝරන්න)" : "Matching Suggestions (Click to fill)"}</div>` +
            hits.map((it, i) => `
              <button type="button" class="catalog-item-btn" data-sidx="${i}">
                <span style="min-width:0;flex:1;">
                  <strong style="display:block;font-size:0.81rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(si ? it.labelSi : it.labelEn)}</strong>
                  <span class="muted" style="font-size:0.73rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(si ? it.labelEn : it.labelSi)}</span>
                </span>
                <span class="pill pill-bill">${escapeHtml(it.unit)}</span>
              </button>
            `).join("");
          liveSug.querySelectorAll("[data-sidx]").forEach(btn => {
            btn.onclick = () => applyPreset(hits[parseInt(btn.dataset.sidx, 10)]);
          });
        };

        document.getElementById("me-cat-toggle").onclick = () => {
          catOpen = !catOpen;
          document.getElementById("me-cat-body").classList.toggle("hidden", !catOpen);
          document.getElementById("me-cat-chev").innerHTML = m3Icon(catOpen ? "expand_less" : "expand_more", 20);
          if (catOpen) renderCatList();
        };
        document.getElementById("me-cat-search").oninput = (e) => { catQuery = e.target.value; renderCatList(); };
        document.getElementById("me-cat-chips").querySelectorAll("[data-cat]").forEach(ch => {
          ch.onclick = () => {
            catFilter = ch.dataset.cat;
            document.getElementById("me-cat-chips").querySelectorAll("[data-cat]").forEach(c => c.classList.toggle("active", c === ch));
            renderCatList();
          };
        });

        siIn.oninput = () => {
          const val = siIn.value;
          isSiAuto = false;
          siAutoHint.classList.add("hidden");
          const canFillEn = !enIn.value.trim() || isEnAuto;
          const m = findBestSlCatalogMatch(val, true);
          if (!val.trim() && isEnAuto) {
            enIn.value = ""; isEnAuto = false; enAutoHint.classList.add("hidden");
          } else if (canFillEn && m) {
            enIn.value = m.labelEn; isEnAuto = true; enAutoHint.classList.remove("hidden");
            if (isUnitAuto || unitSel.value === "kg") { unitSel.value = m.unit; refreshRanges(); }
          }
          renderLiveSuggest(val);
        };

        enIn.oninput = () => {
          const val = enIn.value;
          isEnAuto = false;
          enAutoHint.classList.add("hidden");
          const canFillSi = !siIn.value.trim() || isSiAuto;
          const m = findBestSlCatalogMatch(val, false);
          if (!val.trim() && isSiAuto) {
            siIn.value = ""; isSiAuto = false; siAutoHint.classList.add("hidden");
          } else if (canFillSi && m) {
            siIn.value = m.labelSi; isSiAuto = true; siAutoHint.classList.remove("hidden");
            if (isUnitAuto || unitSel.value === "kg") { unitSel.value = m.unit; refreshRanges(); }
          }
          renderLiveSuggest(val);
        };

        unitSel.onchange = () => { isUnitAuto = false; refreshRanges(); };
        priceIn.oninput = refreshRanges;
        refreshRanges();

        document.getElementById("me-close").onclick = closeModal;
        document.getElementById("me-cancel").onclick = closeModal;
        document.getElementById("me-save").onclick = () => {
          const lSi = siIn.value.trim();
          const lEn = enIn.value.trim();
          const unit = unitSel.value;
          const price = parseFloat(priceIn.value);
          if (!lSi || !lEn || !(price > 0 && Number.isFinite(price))) {
            document.getElementById("me-err").classList.remove("hidden");
            return;
          }
          const list = loadMaterialsRaw();
          const devId = loadProfile().deviceId;
          const now = Date.now();
          let savedMat;
          if (existing) {
            const idx = list.findIndex(m => m.id === existing.id);
            if (idx >= 0) {
              list[idx] = { ...list[idx], labelSi: lSi, labelEn: lEn, unit, unitPriceLkr: price, updatedAt: now, syncStatus: "OFFLINE_PENDING", pendingAction: "UPSERT", updatedByDeviceId: devId };
              savedMat = list[idx];
            }
          } else {
            savedMat = {
              id: genUuid(), cloudDocId: genUuid(), labelSi: lSi, labelEn: lEn, unit, unitPriceLkr: price,
              createdAt: now, updatedAt: now, syncStatus: "OFFLINE_PENDING", pendingAction: "UPSERT", hasSyncedOnce: false, updatedByDeviceId: devId
            };
            list.push(savedMat);
          }
          saveMaterialsRaw(list);
          syncPendingChanges();
          closeModal();
          if (onSaved && savedMat) onSaved(savedMat);
          render();
        };
      });
    }

    function openMaterialPickerModal() {
      const si = state.useSinhala;
      let query = "", unitFilter = "ALL";

      const renderList = () => {
        const addedIds = new Set(state.editor.rows.map(r => r.materialId).filter(Boolean));
        const mats = loadMaterialsRaw().filter(m => m.pendingAction !== "DELETE").filter(m => {
          const q = query.trim().toLowerCase();
          const matchesQ = !q || m.labelSi.toLowerCase().includes(q) || m.labelEn.toLowerCase().includes(q);
          const matchesU = unitFilter === "ALL" || m.unit === unitFilter;
          return matchesQ && matchesU;
        });

        const listEl = document.getElementById("mp-list");
        if (!mats.length) {
          listEl.innerHTML = `<p class="muted" style="text-align:center;padding:20px;">${si ? "ද්‍රව්‍ය හමු නොවීය. නව ද්‍රව්‍යයක් එක් කරන්න." : "No materials found. Add a new material."}</p>`;
          return;
        }
        listEl.innerHTML = mats.map(m => {
          const isAdded = addedIds.has(m.id);
          return `
            <div class="card" style="padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-pick-id="${m.id}">
              <div>
                <div style="font-weight:700;">${escapeHtml(displayLabel(m, si))}</div>
                <div class="muted">${formatLkr(m.unitPriceLkr)} / 1 ${escapeHtml(m.unit)}</div>
              </div>
              ${isAdded ? `<span class="pill pill-added">${m3Icon("check", 14)} ${si ? "එක් කර ඇත" : "ADDED"}</span>` : `<span class="btn btn-sm btn-tonal">${m3Icon("add", 18)}</span>`}
            </div>
          `;
        }).join("");

        listEl.querySelectorAll("[data-pick-id]").forEach(el => {
          el.onclick = () => {
            const mat = loadMaterialsRaw().find(x => x.id === el.dataset.pickId);
            if (!mat) return;
            const addIt = () => {
              state.editor.rows.push({
                rowId: genUuid(),
                materialId: mat.id,
                materialLabelSi: mat.labelSi,
                materialLabelEn: mat.labelEn,
                unit: mat.unit,
                unitPriceLkr: mat.unitPriceLkr,
                quantityInput: ""
              });
              state.editor.error = "";
              closeModal();
              render();
            };
            if (addedIds.has(mat.id)) {
              const nm = displayLabel(mat, si);
              openConfirmModal({
                title: si ? "නැවත එක් කරන්නද?" : "Add Material Again?",
                message: si ? `"${nm}" දැනටමත් ඇස්තමේන්තුවට එක් කර ඇත. නැවත එක් කරන්නද?` : `"${nm}" is already on the quotation. Add again?`,
                confirmLabel: si ? "හරි" : "OK",
                cancelLabel: si ? "අවලංගු කරන්න" : "Cancel",
                onConfirm: addIt
              });
            } else {
              addIt();
            }
          };
        });
      };

      openModal(`
        <div class="modal-card">
          <div class="modal-header">
            <span>${si ? "ද්‍රව්‍යයක් තෝරන්න" : "Select Material"}</span>
            <button class="icon-btn" id="mp-close" aria-label="Close">${m3Icon("close", 20)}</button>
          </div>
          <div class="modal-body">
            <div class="row" style="margin-bottom:10px;">
              <div class="input-icon-wrap">
                <span class="input-leading-icon">${m3Icon("search", 18)}</span>
                <input class="input" id="mp-search" placeholder="${si ? "ද්‍රව්‍යයේ නම සොයන්න…" : "Search material name…"}" />
              </div>
              <button class="btn btn-primary btn-sm" id="mp-new">${m3Icon("add", 18)} ${si ? "නව" : "New"}</button>
            </div>
            <div class="row-wrap" style="margin-bottom:10px;" id="mp-units">
              <button class="chip active" data-u="ALL">${si ? "සියල්ල" : "All"}</button>
              ${UNITS.map(u => `<button class="chip" data-u="${u}">${u}</button>`).join("")}
            </div>
            <div id="mp-list"></div>
          </div>
        </div>
      `, () => {
        document.getElementById("mp-close").onclick = closeModal;
        document.getElementById("mp-search").oninput = (e) => { query = e.target.value; renderList(); };
        document.getElementById("mp-units").querySelectorAll(".chip").forEach(ch => {
          ch.onclick = () => {
            unitFilter = ch.dataset.u;
            document.getElementById("mp-units").querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === ch));
            renderList();
          };
        });
        document.getElementById("mp-new").onclick = () => {
          openMaterialEditorModal(null, (created) => {
            state.editor.rows.push({
              rowId: genUuid(), materialId: created.id,
              materialLabelSi: created.labelSi, materialLabelEn: created.labelEn,
              unit: created.unit, unitPriceLkr: created.unitPriceLkr, quantityInput: ""
            });
            render();
          });
        };
        renderList();
      });
    }

    function openVastuWargaModal() {
      const v = state.vastu;
      const drawModal = () => {
        const items = VASTU.getMatchingWargaRiyans(v.selectedNiwasa, v.maxLimit, v.janmaIdx, v.standard, v.rangeFilter, v.onlyTopSuba);
        openModal(`
          <div class="modal-card" style="max-width:640px;">
            <div class="modal-header">
              <span>${escapeHtml(v.selectedNiwasa)} නැකත — වර්ග රියන්</span>
              <button class="icon-btn" id="vw-close" aria-label="Close">${m3Icon("close", 20)}</button>
            </div>
            <div class="modal-body">
              <div class="row-wrap" style="margin-bottom:8px;">
                <button class="chip ${v.standard.id === "WADU" ? "active" : ""}" data-mr="WADU">${RIYAN.WADU.label}</button>
                <button class="chip ${v.standard.id === "NORMAL" ? "active" : ""}" data-mr="NORMAL">${RIYAN.NORMAL.label}</button>
              </div>
              <div class="row-wrap" style="margin-bottom:12px;">
                <button class="chip ${v.rangeFilter === "ALL" ? "active" : ""}" data-rf="ALL">සියල්ල</button>
                <button class="chip ${v.rangeFilter === "UNDER_1000" ? "active" : ""}" data-rf="UNDER_1000">ව.අ. 1000 ට අඩු</button>
                <button class="chip ${v.rangeFilter === "1000_2000" ? "active" : ""}" data-rf="1000_2000">1000 - 2000</button>
                <button class="chip ${v.rangeFilter === "OVER_2000" ? "active" : ""}" data-rf="OVER_2000">2000 ට වැඩි</button>
                <button class="chip ${v.onlyTopSuba ? "active" : ""}" id="vw-top">වැඩිම ශුභ (8+)</button>
              </div>
              ${items.length === 0 ? `<p class="muted" style="text-align:center;padding:16px;">තෝරාගත් පෙරහනට අදාළ වර්ග රියන් නොමැත.</p>` : `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;">
                  ${items.map(it => `
                    <div class="stat-box" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" data-warga="${it.value}">
                      <div>
                        <strong style="font-size:1rem;">වර්ග රියන් ${it.value}</strong>
                        <div class="muted">වර්ග අඩි ${it.sqFeetFormatted}</div>
                      </div>
                      <span class="pill ${it.subaCount >= 7 ? "pill-suba" : "pill-asuba"}">ශුභ ${it.subaCount} / 11</span>
                    </div>
                  `).join("")}
                </div>
              `}
              ${v.maxLimit < 2000 ? `<button class="btn btn-outline btn-block" id="vw-more" style="margin-top:12px;">තවත් පෙන්වන්න (වර්ග රියන් 2000 දක්වා)</button>` : ""}
            </div>
          </div>
        `, (root) => {
          document.getElementById("vw-close").onclick = closeModal;
          root.querySelectorAll("[data-mr]").forEach(b => b.onclick = () => { v.standard = RIYAN[b.dataset.mr]; drawModal(); });
          root.querySelectorAll("[data-rf]").forEach(b => b.onclick = () => { v.rangeFilter = b.dataset.rf; drawModal(); });
          document.getElementById("vw-top").onclick = () => { v.onlyTopSuba = !v.onlyTopSuba; drawModal(); };
          const moreBtn = document.getElementById("vw-more");
          if (moreBtn) moreBtn.onclick = () => { v.maxLimit = 2000; drawModal(); };
          root.querySelectorAll("[data-warga]").forEach(el => {
            el.onclick = () => openPorondamModal(parseInt(el.dataset.warga, 10), true);
          });
        });
      };
      drawModal();
    }

    function openPorondamModal(wargaRiyan, fromList) {
      const v = state.vastu;
      const res = VASTU.calculate11Porondam(wargaRiyan, v.janmaIdx, v.standard);
      openModal(`
        <div class="modal-card" style="max-width:580px;">
          <div class="modal-header">
            <span>එකොළොස් පොරොන්දම — ව.රියන් ${res.wargaRiyan}</span>
            <button class="icon-btn" id="vp-close" aria-label="Close">${m3Icon("close", 20)}</button>
          </div>
          <div class="modal-body">
            <div class="stat-box" style="margin-bottom:12px;text-align:center;">
              <div style="font-weight:800;font-size:1.1rem;color:var(--md-primary);">වර්ග අඩි ${res.sqFeetFormatted} (${v.standard.label})</div>
              <div style="margin-top:6px;font-weight:800;">අවසාන වාස්තු නිගමනය: <span class="pill ${res.subaCount >= 7 ? "pill-suba" : "pill-asuba"}">${res.rating} (${res.subaCount}/11 ශුභ)</span></div>
            </div>
            ${v.janmaIdx < 0 ? `<p class="muted" style="margin-bottom:8px;">සටහන: ජන්ම නැකත තෝරා නොමැති බැවින්, නැකත් පොරොන්දම සාමාන්‍ය නිවාස නැකත් අනුව ගණනය කර ඇත.</p>` : ""}
            <table class="m3-table">
              <thead><tr><th>පොරොන්දම</th><th>අගය / නම</th><th>ප්‍රතිඵලය</th></tr></thead>
              <tbody>
                ${res.items.map(it => `
                  <tr>
                    <td style="font-weight:700;">${it.label}</td>
                    <td>${it.value}${it.name ? " (" + it.name + ")" : ""}</td>
                    <td><span class="pill ${it.isSuba ? "pill-suba" : "pill-asuba"}">${it.isSuba ? "ශුභයි" : "අශුභයි"}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <div class="modal-footer">
            ${fromList ? `<button class="btn btn-tonal" id="vp-back">${m3Icon("arrow_back", 18)} ලැයිස්තුවට ආපසු</button>` : ""}
            <button class="btn btn-primary" id="vp-ok">වසන්න</button>
          </div>
        </div>
      `, () => {
        document.getElementById("vp-close").onclick = closeModal;
        document.getElementById("vp-ok").onclick = closeModal;
        const b = document.getElementById("vp-back");
        if (b) b.onclick = () => openVastuWargaModal();
      });
    }

            <div class="card pc-sticky" style="display:flex;flex-direction:column;gap:12px;">

                ${syncBadgeHtml(est.syncStatus, si)}

              <div class="stat-box">

                <div class="stat-value">${formatLkr(est.totalAmountLkr)}</div>
                <div class="muted" style="margin-top:2px;">${items.length} ${si ? "ද්‍රව්‍ය" : "items"}</div>
              </div>
              ${fromOther ? `
                <div class="stat-box" style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
                  <div style="font-size:0.8rem;font-weight:700;color:var(--md-secondary);">
                    ${si ? "යාවත්කාලීන කළේ:" : "Updated by"} ${escapeHtml(est.updatedByUserName || est.updatedByDeviceName)}
                  </div>
                  <button class="icon-btn" style="min-width:34px;height:34px;padding:0;" id="fin-devinfo" aria-label="Device Info">${m3Icon("info", 18)}</button>

              <button class="btn btn-primary btn-block" id="fin-download">${m3Icon("download", 18)} ${si ? "PDF / Image බාගන්න" : "Download PDF / Image"}</button>
              <button class="btn btn-tonal btn-block" id="fin-wa">${m3Icon("share", 18)} ${si ? "WhatsApp වෙත යවන්න" : "Send to WhatsApp"}</button>
              <button class="btn btn-outline btn-block" data-nav="est_dashboard">${m3Icon("close", 18)} ${si ? "වසන්න" : "Close"}</button>

    function openFormatPickerModal(est, shareWhatsApp) {
      const si = state.useSinhala;
      openModal(`
        <div class="modal-card" style="max-width:420px;">
          <div class="modal-header">
            <span>${shareWhatsApp ? (si ? "WhatsApp හරහා යවන ආකෘතිය" : "Select Share Format") : (si ? "බාගත කරන ආකෘතිය" : "Select Download Format")}</span>

            <button class="btn btn-tonal btn-block" id="fmt-jpg">${m3Icon("image", 18)} ${si ? "තනි රූපය (JPG)" : "Single Image (JPG)"}</button>
          </div>
        </div>
      `, () => {
        document.getElementById("fmt-close").onclick = closeModal;
        document.getElementById("fmt-pdf").onclick = () => { closeModal(); exportEstimation(est, "PDF", si, shareWhatsApp); };
        document.getElementById("fmt-jpg").onclick = () => { closeModal(); exportEstimation(est, "JPG", si, shareWhatsApp); };
      });
    }

    // =========================================================================
    // 10. MAIN RENDER & EVENT BINDING
    // =========================================================================
    function render() {
      const appEl = document.getElementById("app");
      let pageHtml = "";
      if (state.route === "home") pageHtml = renderHome();
      else if (state.route === "vastu") pageHtml = renderVastu();
      else if (state.route === "slab") pageHtml = renderSlab();
      else if (state.route === "brick") pageHtml = renderBrick();
      else if (state.route === "est_dashboard") pageHtml = renderEstDashboard();
      else if (state.route === "est_trash") pageHtml = renderEstTrash();
      else if (state.route === "mat_manager") pageHtml = renderMatManager();
      else if (state.route === "est_editor") pageHtml = renderEstEditor();
      else if (state.route === "est_finalized") pageHtml = renderEstFinalized();

      appEl.innerHTML = `${renderNavRail()}<div class="workspace-shell">${pageHtml}</div>`;
      bindEvents(appEl);
    }

    function bindEvents(root) {
      root.querySelectorAll("[data-nav]").forEach(el => {
        el.onclick = () => navigate(el.dataset.nav);
      });

      const profBtn = document.getElementById("btn-profile");
      if (profBtn) profBtn.onclick = () => openProfileModal(false);
      const railProf = document.getElementById("rail-profile");
      if (railProf) railProf.onclick = () => openProfileModal(false);

      // Vastu events
      const vj = document.getElementById("vastu-janma");
      if (vj) vj.onchange = (e) => { state.vastu.janmaIdx = parseInt(e.target.value, 10); render(); };
      root.querySelectorAll("[data-niwasa]").forEach(el => {
        el.onclick = () => {
          state.vastu.selectedNiwasa = el.dataset.niwasa;
          state.vastu.maxLimit = 1000;
          state.vastu.rangeFilter = "ALL";
          state.vastu.onlyTopSuba = false;
          openVastuWargaModal();
        };
      });
      root.querySelectorAll("[data-riyan]").forEach(el => {
        el.onclick = () => { state.vastu.standard = RIYAN[el.dataset.riyan]; render(); };
      });
      const vcIn = document.getElementById("vastu-custom-in");
      if (vcIn) vcIn.oninput = (e) => { state.vastu.customInput = e.target.value; state.vastu.customError = false; };
      const vcBtn = document.getElementById("vastu-custom-btn");
      if (vcBtn) vcBtn.onclick = () => {
        const val = parseInt(state.vastu.customInput, 10);
        if (!(val > 0)) { state.vastu.customError = true; render(); return; }
        openPorondamModal(val, false);
      };

      // Slab events
      const slabBtn = document.getElementById("slab-calc");
      if (slabBtn) {
        ["l", "w", "t", "c", "s", "a"].forEach(k => {
          const inp = document.getElementById("slab-" + k);
          if (inp) inp.oninput = (e) => { state.slab[k] = e.target.value; };
        });
        slabBtn.onclick = () => {
          const r = calcConcreteSlab(parseFloat(state.slab.l), parseFloat(state.slab.w), parseFloat(state.slab.t), parseFloat(state.slab.c), parseFloat(state.slab.s), parseFloat(state.slab.a));
          if (!r) { state.slab.error = "කරුණාකර සියලුම මිනුම් සහ මිශ්‍රණ අනුපාත සඳහා ශුන්‍යයට වඩා වැඩි නිවැරදි අගයන් ඇතුළත් කරන්න."; state.slab.result = null; }
          else { state.slab.error = ""; state.slab.result = r; }
          render();
        };
      }

      // Brick events
      const brickBtn = document.getElementById("brick-calc");
      if (brickBtn) {
        ["l", "h"].forEach(k => {
          const inp = document.getElementById("brick-" + k);
          if (inp) inp.oninput = (e) => { state.brick[k] = e.target.value; };
        });
        brickBtn.onclick = () => {
          const r = calcWallBricks(parseFloat(state.brick.l), parseFloat(state.brick.h));
          if (!r) { state.brick.error = "කරුණාකර වලංගු බිත්ති මිනුම් ඇතුළත් කරන්න."; state.brick.result = null; }
          else { state.brick.error = ""; state.brick.result = r; }
          render();
        };
      }

      // Auth buttons
      const signInBtn = document.getElementById("btn-signin");
      if (signInBtn) signInBtn.onclick = signInWithGoogle;
      const signOutBtn = document.getElementById("btn-signout");
      if (signOutBtn) signOutBtn.onclick = signOutCloud;
      const syncBtn = document.getElementById("btn-sync");
      if (syncBtn) syncBtn.onclick = () => syncPendingChanges();

      // Estimation dashboard events
      const lenBtn = document.getElementById("lang-en");
      if (lenBtn) lenBtn.onclick = () => setLang(false);
      const lsiBtn = document.getElementById("lang-si");
      if (lsiBtn) lsiBtn.onclick = () => setLang(true);

      const estSearch = document.getElementById("est-search");
      if (estSearch) estSearch.oninput = (e) => {
        state.estSearch = e.target.value;
        render();
        const el = document.getElementById("est-search");
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
      root.querySelectorAll("[data-df]").forEach(el => el.onclick = () => { state.estDateFilter = el.dataset.df; render(); });
      const sortBtn = document.getElementById("est-sort");
      if (sortBtn) sortBtn.onclick = () => { state.estSort = state.estSort === "NEWEST" ? "OLDEST" : "NEWEST"; render(); };

      const newEstBtn = document.getElementById("btn-new-est");
      if (newEstBtn) newEstBtn.onclick = () => {
        const si = state.useSinhala;
        openModal(`
          <div class="modal-card">
            <div class="modal-header">
              <span>${si ? "නව ඇස්තමේන්තුව" : "New Estimation"}</span>
              <button class="icon-btn" id="ne-close" aria-label="Close">${m3Icon("close", 20)}</button>
            </div>
            <div class="modal-body">
              <div class="field">
                <label>${si ? "ඇස්තමේන්තු නම" : "Estimation Name"}</label>
                <input class="input" id="ne-title" placeholder="${si ? "උදා: ප්‍රධාන නිවසේ ස්ලැබ් එක" : "e.g., Main House Slab"}" />
                <div id="ne-err" class="error-text hidden">${si ? "කරුණාකර ඇස්තමේන්තු නමක් ඇතුළත් කරන්න." : "Please enter an estimation name."}</div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" id="ne-cancel">${si ? "අවලංගු කරන්න" : "Cancel"}</button>
              <button class="btn btn-primary" id="ne-create">${si ? "සාදන්න" : "Create"}</button>
            </div>
          </div>
        `, () => {
          document.getElementById("ne-close").onclick = closeModal;
          document.getElementById("ne-cancel").onclick = closeModal;
          const go = () => {
            const val = document.getElementById("ne-title").value.trim();
            if (!val) { document.getElementById("ne-err").classList.remove("hidden"); return; }
            closeModal();
            openNewEstimation(val);
          };
          document.getElementById("ne-create").onclick = go;
          document.getElementById("ne-title").focus();
        });
      };

      root.querySelectorAll("[data-open-est]").forEach(el => {
        el.onclick = () => { state.finalizedId = el.dataset.openEst; state.showPercentages = false; navigate("est_finalized"); };
      });
      root.querySelectorAll("[data-devinfo]").forEach(el => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const est = loadEstimationsRaw().find(x => x.id === el.dataset.devinfo);
          if (est) openDeviceInfoModal(est);
        };
      });
      root.querySelectorAll("[data-del-est]").forEach(el => {
        el.onclick = (ev) => {
          ev.stopPropagation();
          const est = loadEstimationsRaw().find(x => x.id === el.dataset.delEst);
          if (!est) return;
          const si = state.useSinhala;
          openConfirmModal({
            title: si ? "කසළ බඳුනට යවන්නද?" : "Move to Trash?",
            message: si
              ? `"${est.title}" (${formatBillNumber(est.billNumber)}) දින 30 ක් සඳහා කසළ බඳුනට යවන්නද?`
              : `Move "${est.title}" (${formatBillNumber(est.billNumber)}) to Trash for 30 days?`,
            confirmLabel: si ? "කසළ බඳුනට යවන්න" : "Move to Trash",
            cancelLabel: si ? "අවලංගු කරන්න" : "Cancel",
            isDanger: true,
            onConfirm: () => moveToTrash(est.id)
          });
        };
      });

      // Trash events
      root.querySelectorAll("[data-restore]").forEach(el => el.onclick = () => restoreFromTrash(el.dataset.restore));
      root.querySelectorAll("[data-forever]").forEach(el => {
        el.onclick = () => {
          const si = state.useSinhala;
          openConfirmModal({
            title: si ? "ස්ථිරවම මකා දමන්නද?" : "Delete Forever?",
            message: si
              ? "මෙම ඇස්තමේන්තුව ස්ථිරවම මකා දමන්නද? ඉදිරි බිල්පත් අංක අඩු නොවේ."
              : "Permanently delete this estimation? Future bill numbers will not revise backward.",
            confirmLabel: si ? "ස්ථිරව මකන්න" : "Delete Forever",
            cancelLabel: si ? "අවලංගු කරන්න" : "Cancel",
            isDanger: true,
            onConfirm: () => permanentlyDeleteEstimation(el.dataset.forever)
          });
        };
      });

      // Material manager events
      const mmAdd = document.getElementById("mm-add");
      if (mmAdd) mmAdd.onclick = () => openMaterialEditorModal(null);
      const mmSearch = document.getElementById("mm-search");
      if (mmSearch) mmSearch.oninput = (e) => {
        state.matSearch = e.target.value;
        render();
        const el = document.getElementById("mm-search");
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      };
      root.querySelectorAll("[data-mu]").forEach(el => el.onclick = () => { state.matUnitFilter = el.dataset.mu; render(); });
      root.querySelectorAll("[data-mm-edit]").forEach(el => {
        el.onclick = () => {
          const m = loadMaterialsRaw().find(x => x.id === el.dataset.mmEdit);
          if (m) openMaterialEditorModal(m);
        };
      });
      root.querySelectorAll("[data-mm-del]").forEach(el => {
        el.onclick = () => {
          const si = state.useSinhala;
          openConfirmModal({
            title: si ? "ද්‍රව්‍යය මකන්නද?" : "Delete Material?",
            message: si ? "මෙම ද්‍රව්‍යය ස්ථිරවම මකා දමන්නද?" : "Delete this material from Material Manager?",
            confirmLabel: si ? "මකන්න" : "Delete",
            cancelLabel: si ? "අවලංගු කරන්න" : "Cancel",
            isDanger: true,
            onConfirm: () => {
              const list = loadMaterialsRaw();
              const target = list.find(x => x.id === el.dataset.mmDel);
              if (!target) return;
              if (!target.hasSyncedOnce) saveMaterialsRaw(list.filter(x => x.id !== target.id));
              else {
                target.pendingAction = "DELETE"; target.syncStatus = "OFFLINE_PENDING"; target.updatedAt = Date.now();
                saveMaterialsRaw(list);
                syncPendingChanges();
              }
              render();
            }
          });
        };
      });

      // Editor events
      const edLang = document.getElementById("ed-lang");
      if (edLang) edLang.onclick = () => setLang(!state.useSinhala);
      const edAddMat = document.getElementById("ed-add-mat");
      if (edAddMat) edAddMat.onclick = openMaterialPickerModal;
      const edConfirm = document.getElementById("ed-confirm");
      if (edConfirm) edConfirm.onclick = saveEditorEstimation;
      root.querySelectorAll("[data-rm-row]").forEach(el => {
        el.onclick = () => { state.editor.rows = state.editor.rows.filter(r => r.rowId !== el.dataset.rmRow); render(); };
      });
      root.querySelectorAll("[data-qty-row]").forEach(inp => {
        inp.oninput = (e) => {
          const r = state.editor.rows.find(x => x.rowId === inp.dataset.qtyRow);
          if (!r) return;
          r.quantityInput = e.target.value;
          const q = parseFloat(r.quantityInput);
          const lt = (q > 0 ? q : 0) * r.unitPriceLkr;
          const ltCell = root.querySelector(`[data-lt-row="${r.rowId}"]`);
          if (ltCell) ltCell.textContent = formatLkr(lt).replace("LKR ", "");
          const gt = state.editor.rows.reduce((s, row) => s + ((parseFloat(row.quantityInput) || 0) * row.unitPriceLkr), 0);
          root.querySelectorAll("[data-ed-total]").forEach(gtEl => { gtEl.textContent = formatLkr(gt); });
        };
      });

      // Finalized events
      const finPct = document.getElementById("fin-pct");
      if (finPct) finPct.onclick = () => { state.showPercentages = !state.showPercentages; render(); };
      const finEdit = document.getElementById("fin-edit");
      if (finEdit) finEdit.onclick = () => openEditEstimation(state.finalizedId);
      const finLang = document.getElementById("fin-lang");
      if (finLang) finLang.onclick = () => setLang(!state.useSinhala);
      const finDel = document.getElementById("fin-del");
      if (finDel) finDel.onclick = () => {
        const si = state.useSinhala;
        openConfirmModal({
          title: si ? "කසළ බඳුනට යවන්නද?" : "Move to Trash?",
          message: si ? "මෙම ඇස්තමේන්තුව දින 30 ක් සඳහා කසළ බඳුනට යවන්නද?" : "Move this estimation to Trash for 30 days?",
          confirmLabel: si ? "කසළ බඳුනට යවන්න" : "Move to Trash",
          cancelLabel: si ? "අවලංගු කරන්න" : "Cancel",
          isDanger: true,
          onConfirm: () => {
            moveToTrash(state.finalizedId);
            navigate("est_dashboard");
          }
        });
      };
      const finDev = document.getElementById("fin-devinfo");
      if (finDev) finDev.onclick = () => {
        const est = loadEstimationsRaw().find(x => x.id === state.finalizedId);
        if (est) openDeviceInfoModal(est);
      };
      const finDl = document.getElementById("fin-download");
      if (finDl) finDl.onclick = () => {
        const est = loadEstimationsRaw().find(x => x.id === state.finalizedId);
        if (est) openFormatPickerModal(est, false);
      };
      const finWa = document.getElementById("fin-wa");
      if (finWa) finWa.onclick = () => {
        const est = loadEstimationsRaw().find(x => x.id === state.finalizedId);
        if (est) openFormatPickerModal(est, true);
      };
    }

    // Boot
    purgeExpiredLocalTrash();
    render();
    if (!loadProfile().name.trim()) openProfileModal(true);
    initFirebase();
  </script>
</body>
</html>
